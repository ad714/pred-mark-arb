name: publish dashboard

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"
  workflow_run:
    workflows: ["paper trader", "basket scan"]
    types: [completed]

permissions:
  contents: write
  actions: read

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install --quiet requests

      - name: pairing guard
        run: python deploy/test_pairing.py

      - name: collect recent artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p artifacts
          for wf in "paper trader" "basket scan"; do
            for id in $(gh run list -w "$wf" -s completed -L 6 \
                          --json databaseId --jq '.[].databaseId'); do
              gh run download "$id" --dir "artifacts/$id" 2>/dev/null || true
            done
          done
          find artifacts -type f | head -30

      - name: rebase cumulative log onto newest published copy
        run: |
          git fetch -q origin main
          git checkout -q origin/main -- docs/data 2>/dev/null || true

      - name: build dashboard data
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python deploy/build_dashboard.py artifacts

      - name: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            git fetch -q origin main
            git reset -q --soft origin/main
            git add docs/data
            if git diff --cached --quiet; then
              echo "no change"
              exit 0
            fi
            git commit -q -m "chore: refresh dashboard data"
            if git push -q origin HEAD:main; then
              echo "published on attempt $attempt"
              exit 0
            fi
            echo "push raced, retrying"
            sleep $((attempt * 4))
          done
          exit 1
