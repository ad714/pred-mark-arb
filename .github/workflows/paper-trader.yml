name: paper trader

on:
  workflow_dispatch:
    inputs:
      minutes:
        description: minutes to run before stopping
        default: "58"
  schedule:
    - cron: "*/20 * * * *"

concurrency:
  group: paper-trader
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install --quiet requests

      - name: pairing guard
        run: python deploy/test_pairing.py

      - name: preflight
        run: python deploy/preflight.py

      - name: carry the paper balance forward
        id: money
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          last=$(gh run list -w "paper trader" -s completed -L 1                    --json databaseId --jq '.[0].databaseId' 2>/dev/null || true)
          if [ -n "$last" ]; then
            gh run download "$last" --dir prev 2>/dev/null || true
          fi
          BANKROLL=$(python deploy/carry_balance.py prev)
          echo "bankroll=$BANKROLL" >> "$GITHUB_OUTPUT"
          echo "paper balance carried forward: $BANKROLL"

      - name: paper trade
        working-directory: live-edge
        env:
          MINUTES: ${{ github.event.inputs.minutes || '58' }}
        run: |
          mkdir -p "$GITHUB_WORKSPACE/results/paper"
          timeout "${MINUTES}m" python -u paper_trade.py \
            --out "$GITHUB_WORKSPACE/results/paper" \
            --bankroll ${{ steps.money.outputs.bankroll }} --stake 1 --hold 60 \
            --min-price 0.25 --max-price 0.75 --max-detect-lag 60 \
            2>&1 | tee "$GITHUB_WORKSPACE/results/paper/console.log" || true

      - name: summarize
        if: always()
        run: |
          python deploy/summarize.py results/paper/paper_trades.jsonl \
            | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: paper-${{ github.run_id }}
          path: results/paper/
          retention-days: 90
