name: football scan

on:
  workflow_dispatch:
  schedule:
    - cron: "10 */6 * * *"
  workflow_run:
    workflows: ["basket scan"]
    types: [completed]

permissions:
  contents: write

concurrency:
  group: football-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install --quiet requests

      - name: take the newest published sample as the base
        run: |
          git fetch -q origin main
          git checkout -q origin/main -- docs/data/football.jsonl 2>/dev/null || true
          wc -l docs/data/football.jsonl 2>/dev/null || echo "no prior sample"

      - name: sample every 20 minutes until the budget runs out
        run: bash deploy/football_loop.sh
