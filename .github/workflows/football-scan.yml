name: football scan

on:
  workflow_dispatch:
  schedule:
    - cron: "25 */2 * * *"

permissions:
  contents: write

concurrency:
  group: football-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install --quiet requests

      - name: take the newest published sample as the base
        run: |
          git fetch -q origin main
          git checkout -q origin/main -- docs/data/football.jsonl 2>/dev/null || true
          wc -l docs/data/football.jsonl 2>/dev/null || echo "no prior sample"

      - name: scan
        run: |
          python deploy/football_scan.py docs/data/football.jsonl \
            | tee -a "$GITHUB_STEP_SUMMARY"

      - name: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            git fetch -q origin main
            git reset -q --soft origin/main
            git add docs/data/football.jsonl
            if git diff --cached --quiet; then
              echo "no change"
              exit 0
            fi
            git commit -q -m "chore: football band sample"
            if git push -q origin HEAD:main; then
              echo "published on attempt $attempt"
              exit 0
            fi
            echo "push raced, retrying"
            sleep $((attempt * 4))
          done
          exit 1
